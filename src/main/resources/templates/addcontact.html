<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Contact</title>
</head>
<body>

<h1>Add Contact</h1>

<form th:action="@{/save}" th:object="${contact}" method="post">
  
  <label>First Name:</label>
  <input type="text" th:field="*{firstName}" /><br><br>

  <label>Last Name:</label>
  <input type="text" th:field="*{lastName}" /><br><br>

  <label>City:</label>
  <input type="text" th:field="*{city}" /><br><br>

  <label>Card Sent:</label>
  <input type="checkbox" th:field="*{cardSent}" /><br><br>

  <button type="submit">Save</button>

</form>

</body>
</html>
