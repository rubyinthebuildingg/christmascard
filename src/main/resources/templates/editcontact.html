<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<h1>Edit Contact</h1>

<form action="/update" method="post" th:object="${contact}">
    <input type="hidden" th:field="*{id}" />

    First name: <input type="text" th:field="*{firstName}"><br>
    Last name: <input type="text" th:field="*{lastName}"><br>
    City: <input type="text" th:field="*{city}"><br>
    Card sent: <input type="checkbox" th:field="*{cardSent}"><br>

    <button type="submit">Update</button>
</form>

</body>
</html>
