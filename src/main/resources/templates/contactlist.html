<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Christmas Card Contacts</title>
  </head>
  <a href="/logout">Logout</a>
  <br /><br />
  <body>
    <h1>Christmas Card Contacts</h1>

    <a href="/add">Add New Contact</a>
    <form action="/search" method="get">
      <input type="text" name="keyword" placeholder="Search by last name" />
      <button type="submit">Search</button>
    </form>
    <table border="1">
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>City</th>
        <th>Card Sent</th>
        <th>Action</th>
      </tr>

      <tr th:each="contact : ${contacts}">
        <td th:text="${contact.firstName}"></td>
        <td th:text="${contact.lastName}"></td>
        <td th:text="${contact.city}"></td>
        <td th:text="${contact.cardSent}"></td>
        <td>
          <a th:href="@{/edit/{id}(id=${contact.id})}">Edit</a>
        </td>
      </tr>
    </table>
  </body>
</html>
